name: Build N1 Armbian (s905d)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Image profile: base = minimal, pentest = pentest tools + v2rayA"
        required: false
        default: "pentest"
        type: choice
        options:
          - base
          - pentest
      kernel:
        description: "Kernel branch (ophub/kernel stable)"
        required: false
        default: "6.12.y"
        type: choice
        options:
          - "6.12.y"
          - "6.6.y"
          - "6.1.y"
          - "5.15.y"
          - "5.10.y"
      root_mb:
        description: "Rootfs partition size in MiB (>= 2048; pentest profile needs >= 6656)"
        required: false
        default: "6656"
      install_msf:
        description: "Install Metasploit Framework into image"
        required: false
        default: true
        type: boolean
      upload_release:
        description: "Also publish image to Releases"
        required: false
        default: true
        type: boolean

env:
  TZ: "Etc/UTC"

permissions:
  contents: write

jobs:
  build:
    # aarch64 runner: native chroot, no qemu emulation (public repos get these for free).
    # If the repo ever goes private, switch to ubuntu-24.04 (x86_64 + qemu, slower,
    # counts against the 2000 free minutes/month); scripts auto-detect the arch.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare qemu binfmt (x86_64 host only)
        if: runner.arch == 'X64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghc 2>/dev/null || true
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then sudo rm -rf "${AGENT_TOOLSDIRECTORY}" 2>/dev/null || true; fi
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools e2fsprogs rsync xz-utils bzip2 \
            unzip zip curl wget git ca-certificates binfmt-support || true
          # only needed when running on a non-aarch64 runner
          sudo apt-get install -y qemu-user-static || true
          df -h /

      - name: Clone ophub build tool
        run: git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-armbian

      - name: Download source Armbian image (newest minimal from odroidn2 archive)
        working-directory: amlogic-s9xxx-armbian
        run: |
          set -e
          mkdir -p build/output/images
          cd build/output/images
          sites=(
            "https://armbian.tnahosting.net/dl/odroidn2/archive/"
            "https://imola.armbian.com/dl/odroidn2/archive/"
          )
          name=""
          for site in "${sites[@]}"; do
            listing="$(curl -fsSL --connect-timeout 15 "${site}" | grep -oE 'Armbian[^"<>]*\.img\.xz' | sort -u || true)"
            if [ -n "${listing}" ]; then
              name="$(echo "${listing}" | grep -i minimal | sort -rV | head -n 1 || true)"
              [ -z "${name}" ] && name="$(echo "${listing}" | grep -i server | sort -rV | head -n 1 || true)"
              [ -z "${name}" ] && name="$(echo "${listing}" | grep -vi desktop | sort -rV | head -n 1 || true)"
              [ -z "${name}" ] && name="$(echo "${listing}" | sort -rV | head -n 1)"
              echo "Selected source image from ${site}: ${name}"
              break
            fi
          done
          [ -n "${name}" ] || { echo "no suitable image found"; exit 1; }
          curl -fsSL "${site}${name}" -o src.img.xz
          xz -dk src.img.xz
          codename="$(echo "${name}" | grep -oE '(resolute|questing|plucky|noble|trixie|bookworm|bullseye|jammy)' | head -n 1 || true)"
          [ -n "${codename}" ] || codename="custom"
          ver="$(echo "${name}" | grep -oE '[2-9][0-9]\.[0-9]{1,2}\.[0-9]{1,2}' | head -n 1 || true)"
          [ -n "${ver}" ] || ver="1.0"
          krn="$(echo "${name}" | grep -oE '[0-9]+\.[0-9]{1,2}\.[0-9]{1,3}' | grep -vx "${ver}" | head -n 1 || true)"
          out="Armbian_${ver}-trunk_${codename}_arm64_${krn}.img"
          mv src.img "${out}"
          rm -f src.img.xz
          echo "OS_CODENAME=${codename}" >> "${GITHUB_ENV}"
          echo "BUILD_TAG=Armbian_n1_${{ inputs.profile }}_${codename}_$(date +%Y.%m)" >> "${GITHUB_ENV}"
          ls -lh

      - name: Rebuild for s905d (N1)
        working-directory: amlogic-s9xxx-armbian
        run: |
          set -e
          # boot 256M keeps the whole image within the N1's 8G eMMC when rootfs is large
          sudo ./rebuild -b s905d -k "${{ inputs.kernel }}" -a true -u stable -r ophub/kernel \
            -t ext4 -s 256/${{ inputs.root_mb }} -n ophub
          ls -lh build/output/images/

      - name: Customize rootfs (python / rust / metasploit)
        run: |
          set -e
          cd amlogic-s9xxx-armbian/build/output/images
          # ophub rebuild already gzip-compresses the result; unpack it first
          gz="$(ls *s905d*.img.gz 2>/dev/null | head -n 1 || true)"
          if [ -n "${gz}" ]; then
            echo "Decompressing ophub output: ${gz}"
            gunzip -kf "${gz}"
          fi
          # free the no-longer-needed source image
          rm -f *-trunk_*.img
          cd - >/dev/null
          img="$(ls amlogic-s9xxx-armbian/build/output/images/*s905d*.img | head -n 1)"
          [ -n "${img}" ] || { echo "no rebuilt s905d image found"; exit 1; }
          echo "Customizing: ${img}"
          bash scripts/customize-image.sh "${img}" "${{ inputs.install_msf }}" "${{ inputs.profile }}"

      - name: Compress and checksum
        working-directory: amlogic-s9xxx-armbian/build/output/images
        run: |
          set -e
          img="$(ls *s905d*.img | head -n 1)"
          # drop ophub's .gz and the plain .img after xz to keep only the final artifact
          rm -f *.img.gz
          xz -T0 -1 -k "${img}"
          sha256sum "${img}.xz" > sha256sums.txt
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-n1-s905d-${{ inputs.profile }}-${{ env.OS_CODENAME }}
          path: |
            amlogic-s9xxx-armbian/build/output/images/*.img.xz
            amlogic-s9xxx-armbian/build/output/images/sha256sums.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload to Releases
        if: ${{ inputs.upload_release }}
        uses: ophub/upload-to-releases@main
        with:
          tag: ${{ env.BUILD_TAG }}
          artifacts: "amlogic-s9xxx-armbian/build/output/images/*.img.xz,amlogic-s9xxx-armbian/build/output/images/sha256sums.txt"
          allow_updates: true
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### N1 (s905d) Armbian custom image
            - Board: **s905d (Phicomm N1)**
            - Profile: **${{ inputs.profile }}**
            - OS: Armbian **${{ env.OS_CODENAME }}** (minimal, minimalistic)
            - Kernel: **${{ inputs.kernel }}** (ophub/kernel stable)
            - Built-in: python3 / rust / metasploit-framework
            - pentest profile adds: nmap, hydra, john, hashcat, sqlmap, aircrack-ng, seclists, searchsploit, Responder, impacket, v2rayA + Xray-core, ...
            - Default login: `root` / `1234`
            - Install to eMMC: boot from USB, then run `armbian-install`
            - v2rayA web UI: `http://<n1-ip>:2017` (proxychains4 preset to local socks5 20170)
